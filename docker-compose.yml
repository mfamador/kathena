version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: kathena-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=kathena
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kathena-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: kathena-es
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -f http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kathena-network

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: kathena-redpanda
    command:
      - redpanda
      - start
      - --smp
      - '1'
      - --memory
      - 1G
      - --overprovisioned
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: curl -f http://localhost:9644/v1/status/ready || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kathena-network

volumes:
  mongo-data:
    driver: local
  es-data:
    driver: local
  redpanda-data:
    driver: local

networks:
  kathena-network:
    driver: bridge

